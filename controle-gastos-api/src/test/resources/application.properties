spring.application.name=controle-gastos-api

# Config usada SO pelos testes: src/test/resources tem precedencia sobre
# src/main/resources no classpath de teste. Nao tem segredo real - o
# application.properties de verdade (JWT/e-mail reais) e local e nao versionado,
# e producao usa application-prod.properties. Aponta pro Postgres local
# (localhost:5432/controle_gastos), que e tambem o service container do job
# migration-guard no CI. SPRING_DATASOURCE_URL e o mesmo padrao ja usado na
# senha logo abaixo - usado por scripts/regenerar-schema-console.sh pra apontar
# pro Postgres efemero dele (porta diferente de 5432) sem mexer no default.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/controle_gastos}
spring.datasource.username=postgres
# "admin" e so o fallback pro dev local (convencao da skill ambiente-local); o CI
# injeta SPRING_DATASOURCE_PASSWORD do secret CI_DB_PASSWORD pra bater com o
# Postgres efemero.
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:admin}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.data-source-properties.reWriteBatchedInserts=true

# O Flyway roda no boot do contexto de teste, ANTES do validate - e isto que o
# job migration-guard exercita: V1..Vn do zero num banco vazio (cenario "fresh") e
# baseline + so as migrations depois do baseline num banco que ja tem o schema
# atual (cenario "from-prod-schema", semeado com schema.sql).
# baseline-version tem que ser a MAIOR migration que o schema.sql atual ja reflete
# (hoje V2, desde que o schema.sql passou a ser gerado a partir de V1+V2 - antes
# so tinha V1). Toda vez que uma migration nova entrar E o schema.sql for
# regenerado (scripts/regenerar-schema-console.sh), bump este numero junto -
# senao o cenario from-prod-schema tenta reaplicar migrations que o schema.sql
# ja contém e quebra com "column/table already exists".
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=2
spring.flyway.baseline-description=baseline
spring.jpa.open-in-view=false

# Valores de teste, nao segredos. O JWT precisa de >= 32 bytes (HS256).
app.jwt.secret=teste-controle-gastos-segredo-sem-valor-real-0123456789
app.frontend.url=http://localhost:4200
# Nao e segredo (Client ID e publico), mas nao e um Client ID real - so precisa
# existir pra o bean GoogleTokenVerifierOAuth2 construir no boot do contexto de
# teste; nenhum teste faz chamada de rede de verdade (GoogleTokenVerifier e
# mockado em UsuarioServiceTest).
app.google.client-id=teste-client-id.apps.googleusercontent.com
spring.mail.host=localhost
spring.mail.port=1025
