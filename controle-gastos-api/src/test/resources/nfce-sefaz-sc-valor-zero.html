<!--
  Fixture de teste: mesma estrutura de uma nota real, mas com "Valor a pagar R$"
  igual a "0,00" - nunca uma nota de verdade, então deve ser tratado como falha
  de extração (ver NotaFiscalService.extrairDados), não como sucesso com um
  valor sem sentido.
-->
<!DOCTYPE html>
<html>
<head>
  <title>NFCe - Detalhes</title>
</head>
<body>
  <div data-role="content">
    <div id="conteudo">
      <div class="txtCenter">
        <div id="u20" class="txtTopo">MERCADO TESTE LTDA</div>
      </div>
      <div id="totalNota" class="txtRight">
        <div id="linhaTotal" class="linhaShade"><label>Valor a pagar R$:</label><span class="totalNumb txtMax">0,00</span></div>
      </div>
    </div>
    <div id="infos" class="txtCenter">
      <div data-role="collapsible">
        <h4>Informações gerais da Nota</h4>
        <ul data-role="listview">
          <li><strong>EMISSÃO NORMAL</strong><br><br><strong>Emissão: </strong>15/03/2026 14:20:00</li>
        </ul>
      </div>
    </div>
  </div>
</body>
</html>
