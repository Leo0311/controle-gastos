<!--
  Fixture de teste que simula um bug real observado: a SEFAZ-SC às vezes devolve
  a página de consulta com a estrutura HTML esperada (mesmas classes/IDs de uma
  nota real), mas com o estabelecimento e o valor total ainda não preenchidos do
  lado do servidor - renderizados como "&nbsp;" (placeholder vazio) em vez do
  texto de verdade. Isso passava despercebido pelo null-check original (o texto
  não é null, só visualmente vazio) e virava uma extração "bem-sucedida" com o
  formulário de gasto parcialmente vazio, em vez de cair no fallback de abrir a
  nota numa aba nova - ver NotaFiscalService.textoOuNulo.
-->
<!DOCTYPE html>
<html>
<head>
  <title>NFCe - Detalhes</title>
</head>
<body>
  <div data-role="content">
    <div id="conteudo">
      <div id="avisos"></div>
      <div class="txtCenter">
        <div id="u20" class="txtTopo">&nbsp;</div>
        <div class="text">CNPJ:&nbsp;</div>
      </div>
      <div id="totalNota" class="txtRight">
        <div id="linhaTotal"><label>Qtd. total de itens:</label><span class="totalNumb">&nbsp;</span></div>
        <div id="linhaTotal" class="linhaShade"><label>Valor a pagar R$:</label><span class="totalNumb txtMax">&nbsp;</span></div>
      </div>
    </div>
    <div id="infos" class="txtCenter">
      <div data-role="collapsible">
        <h4>Informações gerais da Nota</h4>
        <ul data-role="listview">
          <li><strong>EMISSÃO NORMAL</strong><br><br><strong>Número: </strong>1000<strong> Série: </strong>1<strong> Emissão: </strong>15/03/2026 14:20:00
            - Via Consumidor
            <br><br><strong>Protocolo de Autorização: </strong>123456789012345 15/03/2026 às 14:20:05
          </li>
        </ul>
      </div>
    </div>
  </div>
</body>
</html>
