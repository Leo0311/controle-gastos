spring.application.name=controle-gastos-api

# DATABASE_URL deve estar no formato JDBC (nao o formato "postgresql://" que o Neon mostra
# por padrao): jdbc:postgresql://<host>/<database>?sslmode=require
# DATABASE_USER e DATABASE_PASSWORD ficam separados (nao embutidos na URL).
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USER}
spring.datasource.password=${DATABASE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Reescreve INSERT em lote (JdbcTemplate.batchUpdate) num unico INSERT multi-linha -
# a pre-geracao de gastos recorrentes usa isso (achado 2.3). Ganho maior aqui, onde
# cada ida ao Neon custa latencia de rede.
spring.datasource.hikari.data-source-properties.reWriteBatchedInserts=true

# O Flyway aplica as migrations (db/migration/V*.sql) no boot, ANTES do Hibernate;
# depois o ddl-auto=validate confere o schema resultante contra as entidades.
# baseline-on-migrate=false (o default, explicito de proposito): o Neon ja tem a
# flyway_schema_history com o baseline V1 gravado (cutover 2026-09-07), entao a flag
# nao serve mais pra nada aqui. Mantendo-a FALSE, se a API apontar por engano pra um
# Postgres que tem tabelas mas nenhum historico do Flyway, ele RECUSA subir com erro
# explicito - em vez de aceitar em silencio e gravar um baseline novo no banco errado.
# No application.properties.example e no src/test/resources ela fica =true de
# proposito (clone com banco pre-Flyway; cenario from-prod-schema do guard de CI).
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.baseline-on-migrate=false
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# JWT (segredo forte gerado especificamente para produção, nunca reaproveitar o do .properties local)
app.jwt.secret=${JWT_SECRET}

# URL publica do frontend (Render) - usada para montar o link de redefinicao de senha
# no e-mail e para liberar no CORS (ver SecurityConfig).
app.frontend.url=${FRONTEND_URL}
app.cors.allowed-origins=http://localhost:4200,${FRONTEND_URL}

# Client ID do OAuth do Google (Console Cloud > Credenciais) - nao e segredo (vai
# embutido no frontend tambem), mas fica como env var pela mesma razao de
# JWT_SECRET/FRONTEND_URL: nada de valor de ambiente hardcoded num arquivo
# versionado. Variavel nova em /etc/controle-gastos.env na VM (GOOGLE_CLIENT_ID) -
# ate ela existir la, o boot em producao falha (property obrigatoria).
app.google.client-id=${GOOGLE_CLIENT_ID}

# E-mail (Gmail SMTP)
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${GMAIL_USER}
spring.mail.password=${GMAIL_APP_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
