spring.application.name=controle-gastos-api

# DATABASE_URL deve estar no formato JDBC (nao o formato "postgresql://" que o Neon mostra
# por padrao): jdbc:postgresql://<host>/<database>?sslmode=require
# DATABASE_USER e DATABASE_PASSWORD ficam separados (nao embutidos na URL).
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USER}
spring.datasource.password=${DATABASE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Reescreve INSERT em lote (JdbcTemplate.batchUpdate) num unico INSERT multi-linha -
# a pre-geracao de gastos recorrentes usa isso (achado 2.3). Ganho maior aqui, onde
# cada ida ao Neon custa latencia de rede.
spring.datasource.hikari.data-source-properties.reWriteBatchedInserts=true

# O Flyway aplica as migrations (db/migration/V*.sql) no boot, ANTES do Hibernate;
# depois o ddl-auto=validate confere o schema resultante contra as entidades.
# baseline-on-migrate: o Neon ja tem as tabelas mas nao tem flyway_schema_history,
# entao no primeiro deploy com Flyway o V1 e registrado como BASELINE (nao roda) e
# so as versoes seguintes (V2..Vn) sao aplicadas.
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.flyway.baseline-description=baseline
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# JWT (segredo forte gerado especificamente para produção, nunca reaproveitar o do .properties local)
app.jwt.secret=${JWT_SECRET}

# URL publica do frontend (Render) - usada para montar o link de redefinicao de senha
# no e-mail e para liberar no CORS (ver SecurityConfig).
app.frontend.url=${FRONTEND_URL}
app.cors.allowed-origins=http://localhost:4200,${FRONTEND_URL}

# E-mail (Gmail SMTP)
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${GMAIL_USER}
spring.mail.password=${GMAIL_APP_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
