<h2 mat-dialog-title>{{ editando ? 'Editar subcategoria' : 'Nova subcategoria' }}</h2>

<form [formGroup]="form" (ngSubmit)="salvar()">
  <mat-dialog-content class="form-content">
    <p class="categoria-pai">Categoria: {{ data.categoriaNome }}</p>

    <mat-form-field appearance="outline">
      <mat-label>Nome</mat-label>
      <input matInput formControlName="nome" maxlength="60">
      @if (form.controls.nome.hasError('required')) {
        <mat-error>Nome é obrigatório.</mat-error>
      }
    </mat-form-field>
  </mat-dialog-content>

  <mat-dialog-actions align="end">
    <button mat-button type="button" (click)="cancelar()">Cancelar</button>
    <button mat-raised-button color="primary" type="submit">Salvar</button>
  </mat-dialog-actions>
</form>
