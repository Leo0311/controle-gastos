<h2 mat-dialog-title>{{ titulo }}</h2>

<mat-dialog-content class="conteudo">
  <p class="instrucao">{{ instrucao }}</p>

  @for (gasto of gastos; track gasto.id) {
    <div class="item-atrasada">
      <div class="item-info">
        <span class="item-descricao">{{ gasto.descricao }}</span>
        <span class="item-meta">
          {{ rotuloVencimento(gasto) }} · {{ gasto.valor | currency:'BRL' }}
        </span>
      </div>
      <button mat-stroked-button (click)="marcarComoPaga(gasto)">
        <mat-icon>check_circle</mat-icon>
        Pagar
      </button>
    </div>
  }
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button mat-button (click)="fechar()">Fechar</button>
</mat-dialog-actions>
