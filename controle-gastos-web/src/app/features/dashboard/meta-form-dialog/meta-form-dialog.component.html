<h2 mat-dialog-title>Meta de economia — {{ data.nomeMes }}/{{ data.ano }}</h2>

<form [formGroup]="form" (ngSubmit)="salvar()">
  <mat-dialog-content class="form-content">
    <p class="instrucao">Quanto você quer economizar (renda menos gastos) neste mês?</p>

    <mat-form-field appearance="outline" class="campo-largo">
      <mat-label>Meta de economia</mat-label>
      <span matTextPrefix>R$&nbsp;</span>
      <input matInput appMascaraMoeda placeholder="0,00" formControlName="valorMeta">
      @if (form.controls.valorMeta.hasError('required')) {
        <mat-error>Meta é obrigatória.</mat-error>
      }
      @if (form.controls.valorMeta.hasError('min')) {
        <mat-error>Valor deve ser maior que zero.</mat-error>
      }
    </mat-form-field>
  </mat-dialog-content>

  <mat-dialog-actions align="end">
    <button mat-button type="button" (click)="cancelar()">Cancelar</button>
    <button mat-raised-button color="primary" type="submit">Salvar</button>
  </mat-dialog-actions>
</form>
