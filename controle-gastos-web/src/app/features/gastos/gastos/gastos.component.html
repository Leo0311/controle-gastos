<div class="cabecalho">
  <h2>Gastos</h2>
  <div class="acoes-cabecalho">
    <button mat-stroked-button [matMenuTriggerFor]="menuExportar" [disabled]="gastos.length === 0">
      <mat-icon>download</mat-icon>
      Exportar CSV
    </button>
    <mat-menu #menuExportar="matMenu">
      <button mat-menu-item (click)="exportarTodos()">
        <mat-icon>list</mat-icon>
        <span>Exportar todos os gastos</span>
      </button>
      <button mat-menu-item (click)="exportarExibidos()">
        <mat-icon>filter_list</mat-icon>
        <span>Exportar gastos exibidos</span>
      </button>
    </mat-menu>

    <button mat-stroked-button (click)="baixarModeloImportacao()">
      <mat-icon>grid_on</mat-icon>
      Baixar modelo de importação
    </button>

    <button mat-stroked-button (click)="importarPlanilha()">
      <mat-icon>upload_file</mat-icon>
      Importar planilha
    </button>
    <input #inputArquivo type="file" accept=".xlsx" class="input-arquivo-oculto" (change)="onArquivoSelecionado($event)">

    <button mat-raised-button color="primary" (click)="novoGasto()">
      <mat-icon>add</mat-icon>
      Novo gasto
    </button>
  </div>
</div>

@if (carregando) {
  <div class="carregando">
    <mat-spinner diameter="40"></mat-spinner>
  </div>
} @else if (gastos.length === 0) {
  <app-empty-state icon="receipt_long" mensagem="Nenhum gasto cadastrado ainda."></app-empty-state>
} @else {
  <div class="tabela-scroll mat-elevation-z2">
    <table mat-table [dataSource]="gastos" class="tabela-gastos">

      <ng-container matColumnDef="id">
        <th mat-header-cell *matHeaderCellDef>ID</th>
        <td mat-cell *matCellDef="let gasto">{{ gasto.id }}</td>
      </ng-container>

      <ng-container matColumnDef="descricao">
        <th mat-header-cell *matHeaderCellDef>Descrição</th>
        <td mat-cell *matCellDef="let gasto">{{ gasto.descricao }}</td>
      </ng-container>

      <ng-container matColumnDef="valor">
        <th mat-header-cell *matHeaderCellDef>Valor</th>
        <td mat-cell *matCellDef="let gasto">{{ gasto.valor | currency:'BRL' }}</td>
      </ng-container>

      <ng-container matColumnDef="categoria">
        <th mat-header-cell *matHeaderCellDef>Categoria</th>
        <td mat-cell *matCellDef="let gasto">{{ gasto.categoria }}</td>
      </ng-container>

      <ng-container matColumnDef="data">
        <th mat-header-cell *matHeaderCellDef>Data</th>
        <td mat-cell *matCellDef="let gasto">{{ gasto.data | date:'dd/MM/yyyy':'UTC' }}</td>
      </ng-container>

      <ng-container matColumnDef="acoes">
        <th mat-header-cell *matHeaderCellDef>Ações</th>
        <td mat-cell *matCellDef="let gasto">
          <button mat-icon-button color="primary" (click)="editar(gasto)" aria-label="Editar">
            <mat-icon>edit</mat-icon>
          </button>
          <button mat-icon-button color="warn" (click)="excluir(gasto)" aria-label="Excluir">
            <mat-icon>delete</mat-icon>
          </button>
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="colunas"></tr>
      <tr mat-row *matRowDef="let row; columns: colunas;"></tr>
    </table>
  </div>
}
