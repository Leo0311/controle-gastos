name: API — guard de migration + deploy (Oracle VM)

# Push na master tocando controle-gastos-api/** (ou schema.sql, ou este workflow):
#   1) job "migration-guard" — sobe um Postgres 18 efêmero e roda as migrations do
#      Flyway em dois cenários (banco vazio; e banco pré-carregado com o schema.sql
#      atual = o cenário do cutover), cada um seguido da suíte @SpringBootTest.
#   2) job "deploy" — SÓ roda se o guard passar: SSH na VM, git pull --ff-only +
#      ./mvnw clean package -DskipTests + sudo systemctl restart controle-gastos,
#      depois checa GET /api/health pela URL pública; se não vier {"status":"UP"}
#      em ~2min, o workflow FALHA e o GitHub manda o e-mail padrão.
#   Em pull_request roda só o guard. workflow_dispatch reimplanta (guard + deploy).
#
# Secrets necessários (Settings > Secrets and variables > Actions):
#   CI_DB_PASSWORD      senha do Postgres efêmero do job migration-guard - qualquer
#                       string aleatória; nunca toca produção, é só pra não deixar
#                       senha literal num repo público.
#   VM_SSH_HOST         host ou IP da VM                 (ex: controle-gastos-leo.duckdns.org)
#   VM_SSH_USER         usuário SSH na VM                (ex: ubuntu / opc)
#   VM_SSH_KEY          chave PRIVADA de deploy (PEM)    - par dedicado, não a sua pessoal
#   VM_REPO_PATH        caminho da raiz do repo na VM    (ex: /home/ubuntu/controle-gastos)
#   VM_SSH_PORT         porta SSH                        (opcional; default 22)
#   VM_SSH_KNOWN_HOSTS  linha(s) de known_hosts da VM    (opcional; ver README - se
#                       ausente, a host key é buscada por ssh-keyscan a cada run)
#
# Pré-requisitos na VM (uma vez):
#   - a .pub correspondente a VM_SSH_KEY em ~/.ssh/authorized_keys do VM_SSH_USER;
#   - sudo sem senha SÓ pra o restart, em /etc/sudoers.d/controle-gastos-deploy:
#       <VM_SSH_USER> ALL=(root) NOPASSWD: /usr/bin/systemctl restart controle-gastos
#     (confira o caminho com `which systemctl`; em algumas distros é /bin/systemctl)
#   - o repo já clonado em VM_REPO_PATH, com a working tree limpa (git pull --ff-only
#     falha de propósito se alguém tiver deixado mudança local na VM).

on:
  push:
    branches: [master]
    paths:
      - 'controle-gastos-api/**'
      - 'controle-gastos/src/main/resources/schema.sql'
      - '.github/workflows/deploy-api.yml'
  pull_request:
    paths:
      - 'controle-gastos-api/**'
      - 'controle-gastos/src/main/resources/schema.sql'
      - '.github/workflows/deploy-api.yml'
  workflow_dispatch: {}

permissions:
  contents: read

env:
  # URL pública do health check - já documentada no README, não é segredo.
  API_HEALTH_URL: https://controle-gastos-leo.duckdns.org/api/health

jobs:
  # ──────────────────────────────────────────────────────────────────────────
  # Guard: nenhuma migration chega na VM sem antes rodar contra um Postgres
  # descartável, nos dois estados que o Flyway pode encontrar em produção.
  # ──────────────────────────────────────────────────────────────────────────
  migration-guard:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    concurrency:
      # matrix.scenario no group pra as duas pernas da matriz NAO disputarem o
      # mesmo group entre si (uma cancelava a outra - run #7). Cada cenario so
      # cancela a versao anterior de si mesmo num push novo.
      group: migration-guard-${{ matrix.scenario }}-${{ github.ref }}
      cancel-in-progress: true
    strategy:
      fail-fast: false
      matrix:
        # fresh            -> banco vazio: Flyway roda V1..Vn do zero (CI / dev novo).
        # from-prod-schema -> banco pré-carregado com o schema.sql atual: Flyway
        #                     baseline no V1 e roda V2..Vn (o cenário real do cutover
        #                     e de todo deploy de schema daí em diante).
        scenario: [fresh, from-prod-schema]
    services:
      postgres:
        image: postgres:18            # casa com o major do Neon (18.6); o local é 14
        env:
          POSTGRES_USER: postgres
          # Postgres descartável (só existe durante o job). A senha vem de um
          # secret pra nao ficar valor literal no repo publico - qualquer string
          # serve, ver CI_DB_PASSWORD nas instrucoes do topo do arquivo.
          POSTGRES_PASSWORD: ${{ secrets.CI_DB_PASSWORD }}
          POSTGRES_DB: controle_gastos
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: (cenário from-prod-schema) semear o Postgres com o schema.sql atual
        if: matrix.scenario == 'from-prod-schema'
        env:
          PGPASSWORD: ${{ secrets.CI_DB_PASSWORD }}
          # Nunca aplicar o schema.sql sem isto: foi um psql -f com client_encoding
          # errado que gerou as 4 subcategorias mojibake no banco local.
          PGCLIENTENCODING: UTF8
        run: |
          psql -h localhost -U postgres -d controle_gastos -v ON_ERROR_STOP=1 \
            -f controle-gastos/src/main/resources/schema.sql

      - name: Migrations + suíte (o @SpringBootTest dispara o Flyway no boot)
        working-directory: controle-gastos-api
        # Casa com a POSTGRES_PASSWORD do service container acima; o
        # src/test/resources/application.properties usa isto e cai em "admin" (dev
        # local) quando a variavel nao esta setada.
        env:
          SPRING_DATASOURCE_PASSWORD: ${{ secrets.CI_DB_PASSWORD }}
        run: ./mvnw -B -ntp test

  # ──────────────────────────────────────────────────────────────────────────
  # Deploy: idêntico ao de antes. Só roda em push/dispatch (nunca em PR) e só se
  # as duas pernas do guard passarem.
  # ──────────────────────────────────────────────────────────────────────────
  deploy:
    needs: migration-guard
    if: ${{ github.event_name != 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Nunca deixa dois deploys correrem em paralelo; não cancela um em andamento
    # (não dá pra interromper um build/restart no meio com segurança).
    concurrency:
      group: deploy-api
      cancel-in-progress: false
    steps:
      - name: Configurar chave SSH
        env:
          SSH_KEY: ${{ secrets.VM_SSH_KEY }}
          SSH_HOST: ${{ secrets.VM_SSH_HOST }}
          SSH_PORT: ${{ secrets.VM_SSH_PORT || '22' }}
          SSH_KNOWN_HOSTS: ${{ secrets.VM_SSH_KNOWN_HOSTS }}
        run: |
          install -m 700 -d "$HOME/.ssh"
          install -m 600 /dev/null "$HOME/.ssh/id_deploy"
          # Normaliza a chave ao gravar: remove CR (\r) - copiar/colar no Windows
          # (Bloco de Notas etc.) costuma injetar \r\n, o que quebra o parsing
          # OpenSSH ("error in libcrypto") sem mudar a aparência do texto. O
          # printf garante um \n final mesmo se o secret tiver colado sem ele.
          printf '%s\n' "$SSH_KEY" | tr -d '\r' > "$HOME/.ssh/id_deploy"
          chmod 600 "$HOME/.ssh/id_deploy"
          # Valida cedo, com mensagem clara, se a chave ainda não fizer parse.
          # -P '' -> nunca fica preso esperando passphrase num runner sem tty.
          if ! ssh-keygen -y -P '' -f "$HOME/.ssh/id_deploy" > "$HOME/.ssh/id_deploy.pub" 2>/dev/null; then
            echo "::error::VM_SSH_KEY não é uma chave privada OpenSSH válida (mesmo após remover CR). Confira: PEM completo de '-----BEGIN' a '-----END' inclusive, sem passphrase, sem linha faltando."
            exit 1
          fi
          echo "Chave OK. Fingerprint (compare com 'ssh-keygen -lf ~/.ssh/controle_gastos_deploy' na sua máquina):"
          ssh-keygen -lf "$HOME/.ssh/id_deploy.pub"
          if [ -n "$SSH_KNOWN_HOSTS" ]; then
            printf '%s\n' "$SSH_KNOWN_HOSTS" | tr -d '\r' > "$HOME/.ssh/known_hosts"
          else
            ssh-keyscan -p "$SSH_PORT" "$SSH_HOST" > "$HOME/.ssh/known_hosts" 2>/dev/null
          fi
          chmod 600 "$HOME/.ssh/known_hosts"

      - name: Deploy na VM (git pull + build + restart)
        env:
          SSH_PORT: ${{ secrets.VM_SSH_PORT || '22' }}
          SSH_TARGET: ${{ secrets.VM_SSH_USER }}@${{ secrets.VM_SSH_HOST }}
          VM_REPO_PATH: ${{ secrets.VM_REPO_PATH }}
        run: |
          ssh -i "$HOME/.ssh/id_deploy" -p "$SSH_PORT" \
            -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=15 \
            -o ServerAliveInterval=30 -o ServerAliveCountMax=10 \
            "$SSH_TARGET" "VM_REPO_PATH='$VM_REPO_PATH' bash -s" <<'REMOTE'
          set -euo pipefail
          cd "$VM_REPO_PATH"
          echo "-> git pull --ff-only"
          git pull --ff-only
          cd controle-gastos-api
          echo "-> ./mvnw clean package -DskipTests"
          ./mvnw -q -B clean package -DskipTests
          echo "-> sudo systemctl restart controle-gastos"
          sudo systemctl restart controle-gastos
          echo "restart disparado"
          REMOTE

      - name: Health check (GET /api/health)
        run: |
          for i in $(seq 1 24); do
            if curl -fsS --max-time 10 "$API_HEALTH_URL" | grep -q '"status":"UP"'; then
              echo "OK - API respondeu {\"status\":\"UP\"} na tentativa $i"
              exit 0
            fi
            echo "tentativa $i: ainda nao UP, nova checagem em 5s"
            sleep 5
          done
          echo "::error::API nao respondeu {\"status\":\"UP\"} em ~2min apos o deploy"
          exit 1

      - name: Remover chave SSH
        if: always()
        run: rm -f "$HOME/.ssh/id_deploy" "$HOME/.ssh/id_deploy.pub"
